{% extends "farmer/layout.html" %}
{% block body %}
<h1 class="forma">Login</h1>

{% if error %}
    <p class="formerror">{{error}}</p>
{% endif %}

<div class="login-page-bg">
  <div class="login-form-container">
    <h1>Login</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Login</button>
    </form>
  </div>
</div>
{% endblock %}
