{%extends "farmer/layout.html"%}
{% block creator %}<h1>New Tray</h1>{% endblock %}
{% block action %} action="/analytics"{% endblock %}
{%block body%}
<button id="myBtn" class="subbtn">New Tray</button>    

{% if data %}
    <div class="analytics" id="analytic_container">
        {% for i in data %}
        <div>
            <form class="ana" action="/filter" method="POST">
                {% csrf_token %}
                <input name="tray_name" value="{{i.name}}" hidden>
                <input name="start" value="{{i.start}}" hidden>
                <button type="submit" class="analytic_box"> 
                    <div class="tray_number"><span class="number">{{i.quantity}}</span> trays </div>
                    <div class="tray_name">{{i.name}}</div>
                    <div class="seedstotal">{{i.seeds}} Grams of Seeds</div>
                    <div class="soilstotal">{{i.soil}} Litre of Soil</div>
                    <div class="start">{{i.start}}</div> 
                    <div class="end">{{i.end}}</div> 
                    <div>{{i.days.days}} days</div>
                    <div class="countdown"></div>
                </button>
            </form>
            <button id="harvestbulk" class="harvestbulk" type="submit" value="{{i.listid}}">Harvest</button>
            <div>
                <form action="/analytics" method="POST">
                    <!-- CSRF TOKEN FOR FORM-->
                    {% csrf_token %}
                    <!-- GET FORM FROM PYTHON DATA SENT  -->
                    <input name="type" value="loadedit" hidden>
                    <input value="{{i.listid}}" name="itemid" hidden>
                    <button class="editplant" type="submit" class="subbtn">Edit</button>
                </form>
            </div>
        </div>

        {% endfor %}
{% else %}
    <h1>Nothing here </h1>
{% endif %}

</div>
<!-- HARVEST POP -->
<div id="Harvestbulkpop" class="modalbulk">
    <!-- NEW PLANT Modal content -->
    <div class="modal-content">
        <div>
            <span class="clsh">&times;</span>
            <h4 class="harvest_title"></h4>
        </div>
        <div class="cells">
            <input id="harvest_bulk_trays" class="harvest_bulk_trays" type="number" placeholder="How many trays" required>
            <input id="harvest_bulk_mix_weight" type="number" placeholder="Harvest Mix Weight" required>
            <input id="harvest_bulk_pack_qtt" type="number" placeholder="Harvest Packs QTTY" required>
            <input id="harvest_date" type="date" value="{{todayu}}">
            <button id="harvest_bulk" type="submit" class="save">Harvest All</button> 
            
        </div>
    </div>
</div>
{%endblock%}
